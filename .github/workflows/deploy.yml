name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci statt npm install: installiert exakt die package-lock.json.
      # Mit "npm install" durfte die Aktion neuere Versionen innerhalb der
      # erlaubten Bereiche ziehen -- zwei aufeinanderfolgende Laeufe erzeugten
      # dadurch bei unveraendertem Quellcode unterschiedliche Bundles
      # (2026-08-02 beobachtet). Erst mit npm ci ist der Abgleich
      # "ausgeliefertes Bundle == lokal geprueftes Bundle" belastbar.
      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

