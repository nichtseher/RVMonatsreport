name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write
  # Nur fuer die Fehlermeldung ganz unten. Ohne sie scheitert ein roter
  # Deploy weiterhin still.
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci statt npm install: installiert exakt die package-lock.json.
      # Mit "npm install" durfte die Aktion neuere Versionen innerhalb der
      # erlaubten Bereiche ziehen -- zwei aufeinanderfolgende Laeufe erzeugten
      # dadurch bei unveraendertem Quellcode unterschiedliche Bundles
      # (2026-08-02 beobachtet). Erst mit npm ci ist der Abgleich
      # "ausgeliefertes Bundle == lokal geprueftes Bundle" belastbar.
      - name: Install Dependencies
        run: npm ci

      # Ab hier wird geprueft, BEVOR gebaut und veroeffentlicht wird. Jeder
      # Push auf main geht sofort live -- ohne dieses Tor gab es keinerlei
      # automatische Kontrolle. Schlaegt ein Schritt fehl, bricht der Job ab
      # und der bisherige Stand bleibt online.
      - name: Typen pruefen
        run: npm run lint

      - name: Rechenkerne und Textkodierung pruefen
        run: npm run check

      # Ab 0.9.18. Bis dahin pruefte dieses Tor Typen, Rechenkerne und
      # Sicherheitsmeldungen -- ausgerechnet die Barrierefreiheit, also die
      # erklaerte Kernanforderung dieser App, war ungeprueft. Geprueft werden
      # waagerechter Ueberlauf bei 360 px in allen drei Schriftgroessen,
      # verstecktes Seitwaertsscrollen in Containern, Trefferflaechen nach
      # WCAG 2.5.8 und ein axe-core-Durchlauf je Ansicht.
      #
      # Ab 0.9.19 zusaetzlich WebKit. Hier stand vorher, ein zweiter Motor
      # lohne nicht -- das gilt fuer Firefox, aber nicht fuer WebKit: Das ist
      # die Engine von iOS-Safari, auf der die Kollegen arbeiten, und die mit
      # der Sieben-Tage-Speicherregel. Kosten: rund 35 Sekunden Laufzeit und
      # ein zweiter Browser-Download.
      - name: Browser fuer die Oberflaechenpruefung
        run: npx playwright install --with-deps chromium webkit

      - name: Oberflaeche und Barrierefreiheit pruefen
        run: npm run check:ui

      - name: Bekannte Sicherheitsluecken melden
        # Nur Bericht, kein Abbruch: Ein neuer Fund in einer Unterabhaengigkeit
        # soll nicht die Veroeffentlichung einer fertigen Version blockieren.
        run: npm audit --omit=dev || true

      - name: Build Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Ein roter Deploy ist hier zweimal unbemerkt geblieben: am 2026-09-02
      # fuenf Tage lang (Produktion stand auf einem aelteren Stand), am
      # 2026-09-12 immerhin 22 Minuten. Beide Male war die Ursache nicht der
      # Fehlschlag, sondern dass ihn niemand sah.
      #
      # Die Benachrichtigungseinstellung liegt im GitHub-KONTO und damit
      # ausserhalb dieses Projekts. Eine Meldung im Repository dagegen laesst
      # sich hier erzeugen -- und ueber sie benachrichtigt GitHub die
      # Beobachter des Repositorys von sich aus.
      #
      # Bestehende offene Meldung bekommt einen Kommentar statt einer zweiten
      # Meldung: Bei mehreren Fehlschlaegen hintereinander waere sonst der
      # Posteingang das Problem.
      - name: Fehlgeschlagenen Deploy melden
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const kurz = context.sha.substring(0, 7);
            const lauf = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              `Der Deploy für \`${kurz}\` ist fehlgeschlagen.`,
              ``,
              `Lauf: ${lauf}`,
              ``,
              `**Die Produktion liegt weiter auf dem vorherigen Stand.** Das ist die Absicht des Prüftores –`,
              `aber es heißt auch: Was gerade gepusht wurde, ist NICHT live.`,
            ].join(`\n`);
            const offen = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: `open`,
              labels: `deploy-fehler`,
              per_page: 1,
            });
            if (offen.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: offen.data[0].number,
                body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Deploy fehlgeschlagen`,
                body: text,
                labels: [`deploy-fehler`],
              });
            }

